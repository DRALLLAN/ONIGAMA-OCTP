services:
  postgres:
    image: postgres:17
    container_name: octp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: octp
      POSTGRES_USER: octp
      POSTGRES_PASSWORD: octp_password
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - octp-network

  redis:
    image: redis:8-alpine
    container_name: octp-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - octp-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: octp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: octp
      RABBITMQ_DEFAULT_PASS: octp_password
    ports:
      - "15673:5672"
      - "25672:15672"
    networks:
      - octp-network

volumes:
  postgres-data:

networks:
  octp-network:
    driver: bridge